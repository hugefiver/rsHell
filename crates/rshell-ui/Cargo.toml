[package]
name = "rshell-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.10.3" }
pangocairo = "0.21.5"
relm4 = "0.10.1"
rshell-core = { path = "../../corelibs/crates/rshell-core" }
rshell-platform = { path = "../../corelibs/crates/rshell-platform" }

[dev-dependencies]
async-channel = "2.5"
async-trait = "0.1"
secrecy = "0.10.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[[test]]
name = "checkpoint_lifecycle_native"
path = "tests/checkpoint_lifecycle_native.rs"
harness = false

[[test]]
name = "dynamic_geometry_native"
path = "tests/dynamic_geometry_native.rs"
harness = false

[[test]]
name = "terminal_view_teardown_native"
path = "tests/terminal_view_teardown_native.rs"
harness = false
