name: Release

on:
  push:
    branches: [master]
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  GVSBUILD_VERSION: '2025.3.0'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install GTK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          & sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sudo apt-get install --yes libgtk-4-dev pkg-config xvfb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install GTK dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          & brew install gtk4 pkg-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gtkPrefix = (& brew --prefix gtk4).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($gtkPrefix)) { exit 1 }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$gtkPrefix/lib/pkgconfig"

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: Cache gvsbuild
        if: runner.os == 'Windows'
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build
          key: gvsbuild-${{ env.GVSBUILD_VERSION }}-gtk4
          save-always: false

      - name: Build GTK4 via gvsbuild
        if: runner.os == 'Windows' && steps.cache-gtk.outputs.cache-hit != 'true'
        run: |
          pip install gvsbuild==${{ env.GVSBUILD_VERSION }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gvsbuildAttempts = 3
          $gtkRoot = "C:\gtk-build\gtk\x64\release"
          $gtkBuildSucceeded = $false
          for ($attempt = 1; $attempt -le $gvsbuildAttempts; $attempt++) {
            gvsbuild build gtk4
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $gtkRoot -PathType Container)) {
              $gtkBuildSucceeded = $true
              break
            }
            if ($attempt -lt $gvsbuildAttempts) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $gtkBuildSucceeded) { throw "gvsbuild GTK build failed after 3 attempts." }

      - name: Setup Windows environment
        if: runner.os == 'Windows'
        run: |
          $gtkRoot = "C:\gtk-build\gtk\x64\release"
          if (-not (Test-Path -LiteralPath $gtkRoot -PathType Container)) { throw "gvsbuild GTK root is unavailable." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$gtkRoot\lib\pkgconfig"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIB=$gtkRoot\lib"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$gtkRoot\bin"
          $libDir = "$gtkRoot\lib"
          if (-not (Test-Path "$libDir\z.lib")) {
            if (Test-Path "$libDir\zlib1.lib") {
              Copy-Item "$libDir\zlib1.lib" "$libDir\z.lib"
            } elseif (Test-Path "$libDir\zlib.lib") {
              Copy-Item "$libDir\zlib.lib" "$libDir\z.lib"
            } else {
              throw "gvsbuild zlib import library is unavailable."
            }
          }

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          $stageRoot = Join-Path "dist" "rshell-${{ matrix.target }}"
          if (Test-Path -LiteralPath $stageRoot) { Remove-Item -LiteralPath $stageRoot -Recurse -Force }
          [void](New-Item -ItemType Directory -Path $stageRoot)
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/rshell" -Destination (Join-Path $stageRoot "rshell")
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $stageRoot "LICENSE")
          Copy-Item -LiteralPath "README.md" -Destination (Join-Path $stageRoot "README.md")
          $package = "rshell-${{ matrix.target }}.tar.gz"
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Force }
          & tar -C "dist" -czf $package "rshell-${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $displayServer = $null
          try {
            if ('${{ runner.os }}' -eq 'Linux') {
              $env:DISPLAY = ':99'
              $displayServer = Start-Process -FilePath Xvfb -ArgumentList @(':99', '-screen', '0', '1280x1024x24', '-nolisten', 'tcp') -PassThru
            } elseif ('${{ runner.os }}' -eq 'macOS') {
              $broadway = Get-Command -Name gtk4-broadwayd -ErrorAction Stop
              $env:GDK_BACKEND = "broadway"
              $env:BROADWAY_DISPLAY = ":5"
              $displayServer = Start-Process -FilePath $broadway.Source -ArgumentList @(':5') -PassThru
            }
            if ($null -ne $displayServer) {
              Start-Sleep -Seconds 1
              if ($displayServer.HasExited) { throw "The package GTK display server stopped before validation." }
            }
            $env:RSHELL_TARGET = "${{ matrix.target }}"
            $env:RSHELL_PACKAGE = $package
            pwsh -NoProfile -File scripts/qa/assert-package.ps1 -Target $env:RSHELL_TARGET -Package $env:RSHELL_PACKAGE
            if ($LASTEXITCODE -ne 0) { throw "Package validation failed." }
          }
          finally {
            if ($null -ne $displayServer -and -not $displayServer.HasExited) {
              Stop-Process -Id $displayServer.Id -Force
              $displayServer.WaitForExit()
            }
          }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $dist = Join-Path "dist" "rshell-${{ matrix.target }}"
          $gtkRoot = "C:\gtk-build\gtk\x64\release"
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          [void](New-Item -ItemType Directory -Path $dist)
          Copy-Item -LiteralPath "target\${{ matrix.target }}\release\rshell.exe" -Destination (Join-Path $dist "rshell.exe")
          $dlls = @(Get-ChildItem -LiteralPath "$gtkRoot\bin" -Filter "*.dll" -File | Where-Object { $_.Name -notmatch '(?i)(ssh2|libssl|libcrypto)' })
          if ($dlls.Count -eq 0) { throw "gvsbuild GTK DLLs are unavailable." }
          foreach ($dll in $dlls) { Copy-Item -LiteralPath $dll.FullName -Destination $dist }
          $schemasSource = "$gtkRoot\share\glib-2.0\schemas"
          if (-not (Test-Path -LiteralPath $schemasSource -PathType Container)) { throw "GLib schemas are unavailable." }
          $schemas = Join-Path $dist "share\glib-2.0\schemas"
          [void](New-Item -ItemType Directory -Force -Path $schemas)
          $schemaFiles = @(Get-ChildItem -LiteralPath $schemasSource -Force)
          if ($schemaFiles.Count -eq 0) { throw "GLib schemas are unavailable." }
          foreach ($schemaFile in $schemaFiles) { Copy-Item -LiteralPath $schemaFile.FullName -Destination $schemas -Recurse -Force }
          $compiledSchemas = Join-Path $schemas "gschemas.compiled"
          if (-not (Test-Path -LiteralPath $compiledSchemas -PathType Leaf)) {
            $compileSchemas = Join-Path $gtkRoot "bin\glib-compile-schemas.exe"
            if (-not (Test-Path -LiteralPath $compileSchemas -PathType Leaf)) { throw "glib-compile-schemas is unavailable." }
            & $compileSchemas $schemas
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $pixbufSource = "$gtkRoot\lib\gdk-pixbuf-2.0"
          if (-not (Test-Path -LiteralPath $pixbufSource -PathType Container)) { throw "GDK Pixbuf loaders are unavailable." }
          $pixbufDestination = Join-Path $dist "lib\gdk-pixbuf-2.0"
          [void](New-Item -ItemType Directory -Force -Path (Split-Path -Parent $pixbufDestination))
          Copy-Item -LiteralPath $pixbufSource -Destination $pixbufDestination -Recurse -Force
          $pixbufRuntime = @(Get-ChildItem -LiteralPath $pixbufDestination -Directory -Force)
          if ($pixbufRuntime.Count -ne 1 -or $pixbufRuntime[0].Name -ne "2.10.0") { throw "GDK Pixbuf runtime layout is invalid." }
          $loaderCachePath = Join-Path $pixbufRuntime[0].FullName "loaders.cache"
          if (-not (Test-Path -LiteralPath $loaderCachePath -PathType Leaf) -or (Get-Item -LiteralPath $loaderCachePath).Length -eq 0) { throw "GDK Pixbuf loader cache is unavailable." }
          $loaderDirectory = Join-Path $pixbufRuntime[0].FullName "loaders"
          if (Test-Path -LiteralPath $loaderDirectory -PathType Container) {
            $loaderDlls = @(Get-ChildItem -LiteralPath $loaderDirectory -Filter "*.dll" -File)
            if ($loaderDlls.Count -eq 0) { throw "GDK Pixbuf loader DLLs are unavailable." }
            $queryLoaders = Join-Path $gtkRoot "bin\gdk-pixbuf-query-loaders.exe"
            if (-not (Test-Path -LiteralPath $queryLoaders -PathType Leaf)) { throw "gdk-pixbuf-query-loaders is unavailable." }
            $stagedQueryLoaders = Join-Path $dist "gdk-pixbuf-query-loaders.exe"
            Copy-Item -LiteralPath $queryLoaders -Destination $stagedQueryLoaders
            try {
              $loaderCache = & $stagedQueryLoaders @($loaderDlls.FullName)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            finally {
              Remove-Item -LiteralPath $stagedQueryLoaders -Force
              if (Test-Path -LiteralPath $stagedQueryLoaders) { throw "staged gdk-pixbuf-query-loaders cleanup failed." }
            }
            if (@($loaderCache | Where-Object { $_ -match '^"[A-Za-z]:[\\/]' }).Count -ne 0) { throw "GDK Pixbuf loader cache is not relocatable." }
            [System.IO.File]::WriteAllLines($loaderCachePath, [string[]]$loaderCache, [System.Text.UTF8Encoding]::new($false))
          }
          elseif ([System.IO.File]::ReadAllText($loaderCachePath) -notmatch "GdkPixbuf Image Loader Modules file") {
            throw "GDK Pixbuf built-in loader cache is invalid."
          }
          $fontsSource = "$gtkRoot\etc\fonts"
          $fontconfigSource = "$gtkRoot\share\fontconfig"
          if (-not (Test-Path -LiteralPath $fontsSource -PathType Container) -or -not (Test-Path -LiteralPath $fontconfigSource -PathType Container)) { throw "fontconfig runtime files are unavailable." }
          [void](New-Item -ItemType Directory -Force -Path (Join-Path $dist "etc"))
          [void](New-Item -ItemType Directory -Force -Path (Join-Path $dist "share"))
          Copy-Item -LiteralPath $fontsSource -Destination (Join-Path $dist "etc\fonts") -Recurse -Force
          Copy-Item -LiteralPath $fontconfigSource -Destination (Join-Path $dist "share\fontconfig") -Recurse -Force
          $package = "rshell-${{ matrix.target }}.zip"
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Force }
          Compress-Archive -LiteralPath $dist -DestinationPath $package
          $env:RSHELL_TARGET = "${{ matrix.target }}"
          $env:RSHELL_PACKAGE = $package
          pwsh -NoProfile -File scripts/qa/assert-package.ps1 -Target $env:RSHELL_TARGET -Package $env:RSHELL_PACKAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rshell-${{ matrix.target }}
          path: rshell-${{ matrix.target }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rshell-${{ matrix.target }}
          path: rshell-${{ matrix.target }}.zip

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rshell-*.tar.gz
            rshell-*.zip

      - name: Update Nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          $existing = & gh release view nightly --json id 2>&1
          if ($LASTEXITCODE -eq 0) {
            & gh release delete nightly --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif (($existing -join "`n") -notmatch "(?i)not found") {
            throw "Unable to determine whether the nightly release exists."
          }
          $notes = "Automated build from master ($([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm UTC'))). May be unstable."
          & gh release create nightly --title "Nightly Build" --notes $notes --prerelease rshell-*.tar.gz rshell-*.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
