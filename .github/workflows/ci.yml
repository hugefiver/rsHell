name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  GVSBUILD_VERSION: '2025.3.0'

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-26
          - name: Windows x86_64
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow contract
        run: |
          pwsh -NoProfile -File scripts/qa/workflow-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install GTK, display, and Secret Service dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          & sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sudo apt-get install --yes libgtk-4-dev pkg-config xvfb dbus-x11 gnome-keyring libsecret-1-0 libsecret-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install GTK dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          & brew install gtk4 pkg-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gtkPrefix = (& brew --prefix gtk4).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($gtkPrefix)) { exit 1 }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$gtkPrefix/lib/pkgconfig"

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: Cache gvsbuild GTK runtime
        if: runner.os == 'Windows'
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build
          key: gvsbuild-${{ env.GVSBUILD_VERSION }}-gtk4
          save-always: false

      - name: Build GTK4 via gvsbuild
        if: runner.os == 'Windows' && steps.cache-gtk.outputs.cache-hit != 'true'
        run: |
          pip install gvsbuild==${{ env.GVSBUILD_VERSION }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gvsbuildAttempts = 3
          $gtkRoot = "C:\gtk-build\gtk\x64\release"
          $gtkBuildSucceeded = $false
          for ($attempt = 1; $attempt -le $gvsbuildAttempts; $attempt++) {
            gvsbuild build gtk4
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $gtkRoot -PathType Container)) {
              $gtkBuildSucceeded = $true
              break
            }
            if ($attempt -lt $gvsbuildAttempts) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $gtkBuildSucceeded) { throw "gvsbuild GTK build failed after 3 attempts." }

      - name: Setup Windows environment
        if: runner.os == 'Windows'
        run: |
          $gtkRoot = "C:\gtk-build\gtk\x64\release"
          if (-not (Test-Path -LiteralPath $gtkRoot -PathType Container)) { throw "gvsbuild GTK root is unavailable." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$gtkRoot\lib\pkgconfig"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIB=$gtkRoot\lib"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RSHELL_GTK_ROOT=$gtkRoot"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$gtkRoot\bin"
          $libDir = "$gtkRoot\lib"
          if (-not (Test-Path "$libDir\z.lib")) {
            if (Test-Path "$libDir\zlib1.lib") {
              Copy-Item "$libDir\zlib1.lib" "$libDir\z.lib"
            } elseif (Test-Path "$libDir\zlib.lib") {
              Copy-Item "$libDir\zlib.lib" "$libDir\z.lib"
            } else {
              throw "gvsbuild zlib import library is unavailable."
            }
          }

      - uses: Swatinem/rust-cache@v2

      - name: Confirm system OpenSSH tools
        run: |
          $ssh = Get-Command ssh -ErrorAction Stop
          $sshKeygen = Get-Command ssh-keygen -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($ssh.Source) -or [string]::IsNullOrWhiteSpace($sshKeygen.Source)) {
            throw "System OpenSSH tools are unavailable."
          }

      - name: Start isolated OpenSSH agent (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          $agentOutput = & ssh-agent -s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $variables = @{}
          foreach ($line in $agentOutput) {
            if ($line -match '^(SSH_AUTH_SOCK|SSH_AGENT_PID)=([^;]+);') {
              $variables[$matches[1]] = $matches[2]
            }
          }
          if ($variables.Count -ne 2) { throw "ssh-agent did not provide a complete environment." }
          foreach ($entry in $variables.GetEnumerator()) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
          }

      - name: Start Credential Manager SSH agent (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-Command cmdkey.exe -ErrorAction Stop | Out-Null
          $agent = Get-Service -Name ssh-agent -ErrorAction Stop
          $startupMode = (Get-CimInstance -ClassName Win32_Service -Filter "Name='ssh-agent'" -ErrorAction Stop).StartMode
          if ([string]::IsNullOrWhiteSpace($startupMode)) { throw "Credential Manager SSH agent startup mode is unavailable." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RSHELL_WINDOWS_SSH_AGENT_BASELINE_STATUS=$($agent.Status)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RSHELL_WINDOWS_SSH_AGENT_BASELINE_START_MODE=$startupMode"
          if ($startupMode -eq 'Disabled') {
            Set-Service -Name ssh-agent -StartupType Manual -ErrorAction Stop
          }
          if ($agent.Status -ne 'Running') {
            Start-Service -Name ssh-agent -ErrorAction Stop
          }

      - name: Run required workspace gates
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --all-features --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $displayServer = $null
          $workspaceTestExitCode = 1
          try {
            if ('${{ runner.os }}' -eq 'Linux') {
              $env:DISPLAY = ':98'
              $displayServer = Start-Process -FilePath Xvfb -ArgumentList @(':98', '-screen', '0', '1280x1024x24', '-nolisten', 'tcp') -PassThru
            }
            if ($null -ne $displayServer) {
              Start-Sleep -Seconds 1
              if ($displayServer.HasExited) { throw "The workspace GTK display server stopped before tests started." }
            }
            cargo test --workspace --all-features --locked
            $workspaceTestExitCode = $LASTEXITCODE
          }
          finally {
            if ($null -ne $displayServer -and -not $displayServer.HasExited) {
              Stop-Process -Id $displayServer.Id -Force
              $displayServer.WaitForExit()
            }
          }
          if ($workspaceTestExitCode -ne 0) { exit $workspaceTestExitCode }
          cargo test --locked --test production_module_limits
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run terminal engine gate
        run: |
          pwsh -NoProfile -File scripts/qa/terminal-engine-gate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Secret Service vault probe and P0 All smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "rshell-linux-p0-$([Guid]::NewGuid().ToString('N'))"
          [void](New-Item -ItemType Directory -Path $runtimeRoot)
          $xvfb = $null
          try {
            $env:DISPLAY = ':99'
            $env:XDG_RUNTIME_DIR = $runtimeRoot
            $env:XDG_DATA_HOME = Join-Path $runtimeRoot "data"
            [void](New-Item -ItemType Directory -Path $env:XDG_DATA_HOME)
            $xvfb = Start-Process -FilePath Xvfb -ArgumentList @(':99', '-screen', '0', '1280x1024x24', '-nolisten', 'tcp') -PassThru
            Start-Sleep -Seconds 1
            if ($xvfb.HasExited) { throw "Xvfb stopped before the GTK smoke started." }
            $env:RSHELL_P0_QA_VAULT_REFERENCE = "rshell://credential/$([Guid]::NewGuid().ToString('N'))"
            $env:RSHELL_P0_QA_VAULT_OBSERVATION_PATH = Join-Path $runtimeRoot "vault-observation.json"
            $inner = @'
          $ErrorActionPreference = "Stop"
          $keyringPassword = "rshell-ci-$([Guid]::NewGuid().ToString('N'))"
          $keyringEnvironment = @($keyringPassword | & gnome-keyring-daemon --unlock --components=secrets)
          if ($LASTEXITCODE -ne 0) { throw "gnome-keyring unlock failed" }
          foreach ($line in $keyringEnvironment) {
            if ($line -match '^([A-Z_][A-Z0-9_]*)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $warmupKey = "rshell-ci-$([Guid]::NewGuid().ToString('N'))"
          $warmupSecret = [Guid]::NewGuid().ToString('N')
          $warmupSecret | & secret-tool store --label="rshell CI warmup" rshell-ci $warmupKey
          if ($LASTEXITCODE -ne 0) { throw "Secret Service warmup store failed" }
          $warmupValue = (& secret-tool lookup rshell-ci $warmupKey).Trim()
          if ($LASTEXITCODE -ne 0 -or $warmupValue -ne $warmupSecret) { throw "Secret Service warmup lookup failed" }
          & secret-tool clear rshell-ci $warmupKey
          if ($LASTEXITCODE -ne 0) { throw "Secret Service warmup cleanup failed" }
          try {
            cargo test --locked -p rshell-storage --features test-support --test system_vault system_vault_real_os_probe_uses_coordinator_and_cleans_random_entry -- --ignored --exact --nocapture
            if ($LASTEXITCODE -ne 0) { throw "system vault probe failed" }
          }
          finally {
            cargo test --locked -p rshell-storage --features test-support --test system_vault system_vault_cleanup_exact_parent_reference -- --ignored --exact --nocapture
            if ($LASTEXITCODE -ne 0) { throw "system vault cleanup failed" }
          }
          pwsh -NoProfile -File scripts/qa/p0-smoke.ps1 -Mode All
          exit $LASTEXITCODE
          '@
            & dbus-run-session -- pwsh -NoProfile -Command $inner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            if ($null -ne $xvfb -and -not $xvfb.HasExited) {
              Stop-Process -Id $xvfb.Id -Force
              $xvfb.WaitForExit()
            }
            if (Test-Path -LiteralPath $runtimeRoot -PathType Container) {
              Remove-Item -LiteralPath $runtimeRoot -Recurse -Force
            }
          }

      - name: Run temporary keychain vault probe and P0 All smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          $keychainPath = Join-Path $env:RUNNER_TEMP "rshell-p0-$([Guid]::NewGuid().ToString('N')).keychain-db"
          $keychainPassword = [Guid]::NewGuid().ToString('N')
          $vaultRoot = Join-Path $env:RUNNER_TEMP "rshell-macos-p0-$([Guid]::NewGuid().ToString('N'))"
          [void](New-Item -ItemType Directory -Path $vaultRoot)
          $originalKeychain = (& security default-keychain -d user).Trim().Trim('"')
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($originalKeychain)) { throw "The default keychain is unavailable." }
          $originalKeychainSearchOutput = @(& security list-keychains -d user)
          if ($LASTEXITCODE -ne 0) { throw "The keychain search list is unavailable." }
          $originalKeychainSearchList = @($originalKeychainSearchOutput | ForEach-Object { $_.Trim().Trim('"') } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($originalKeychainSearchList.Count -eq 0) { throw "The keychain search list is unavailable." }
          $created = $false
          $defaultChanged = $false
          $searchListChanged = $false
          try {
            & security create-keychain -p $keychainPassword $keychainPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $created = $true
            & security set-keychain-settings -lut 3600 $keychainPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & security unlock-keychain -p $keychainPassword $keychainPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $temporarySearchList = @($keychainPath) + $originalKeychainSearchList
            & security list-keychains -d user -s @temporarySearchList
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $searchListChanged = $true
            & security default-keychain -s $keychainPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $defaultChanged = $true
            $env:RSHELL_P0_QA_VAULT_REFERENCE = "rshell://credential/$([Guid]::NewGuid().ToString('N'))"
            $env:RSHELL_P0_QA_VAULT_OBSERVATION_PATH = Join-Path $vaultRoot "vault-observation.json"
            try {
              cargo test --locked -p rshell-storage --features test-support --test system_vault system_vault_real_os_probe_uses_coordinator_and_cleans_random_entry -- --ignored --exact --nocapture
              if ($LASTEXITCODE -ne 0) { throw "system vault probe failed" }
            }
            finally {
              cargo test --locked -p rshell-storage --features test-support --test system_vault system_vault_cleanup_exact_parent_reference -- --ignored --exact --nocapture
              if ($LASTEXITCODE -ne 0) { throw "system vault cleanup failed" }
            }
            pwsh -NoProfile -File scripts/qa/p0-smoke.ps1 -Mode All
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            $cleanupErrors = [System.Collections.Generic.List[string]]::new()
            if ($defaultChanged) {
              try {
                & security default-keychain -s $originalKeychain
                if ($LASTEXITCODE -ne 0) { throw "restore failed" }
              }
              catch { $cleanupErrors.Add('default keychain restore failed') }
            }
            if ($searchListChanged) {
              try {
                & security list-keychains -d user -s @originalKeychainSearchList
                if ($LASTEXITCODE -ne 0) { throw "restore failed" }
              }
              catch { $cleanupErrors.Add('keychain search list restore failed') }
            }
            if ($created) {
              try {
                & security delete-keychain $keychainPath
                if ($LASTEXITCODE -ne 0) { throw "delete failed" }
              }
              catch { $cleanupErrors.Add('temporary keychain delete failed') }
            }
            try {
              if (Test-Path -LiteralPath $vaultRoot -PathType Container) {
                Remove-Item -LiteralPath $vaultRoot -Recurse -Force
              }
              if (Test-Path -LiteralPath $vaultRoot) { throw "remove failed" }
            }
            catch { $cleanupErrors.Add('vault root cleanup failed') }
            if ($cleanupErrors.Count -ne 0) {
              throw "Temporary macOS keychain cleanup failed."
            }
          }

      - name: Run Credential Manager vault probe and P0 All smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          $vaultRoot = Join-Path $env:RUNNER_TEMP "rshell-windows-p0-$([Guid]::NewGuid().ToString('N'))"
          [void](New-Item -ItemType Directory -Path $vaultRoot)
          try {
            $env:RSHELL_P0_QA_VAULT_REFERENCE = "rshell://credential/$([Guid]::NewGuid().ToString('N'))"
            $env:RSHELL_P0_QA_VAULT_OBSERVATION_PATH = Join-Path $vaultRoot "vault-observation.json"
            try {
              cargo test --locked -p rshell-storage --features test-support --test system_vault system_vault_real_os_probe_uses_coordinator_and_cleans_random_entry -- --ignored --exact --nocapture
              if ($LASTEXITCODE -ne 0) { throw "system vault probe failed" }
            }
            finally {
              cargo test --locked -p rshell-storage --features test-support --test system_vault system_vault_cleanup_exact_parent_reference -- --ignored --exact --nocapture
              if ($LASTEXITCODE -ne 0) { throw "system vault cleanup failed" }
            }
            pwsh -NoProfile -File scripts/qa/p0-smoke.ps1 -Mode All
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            if (Test-Path -LiteralPath $vaultRoot -PathType Container) {
              Remove-Item -LiteralPath $vaultRoot -Recurse -Force
            }
          }

      - name: Validate failed P0 artifacts are redacted
        id: failed-p0-redaction
        if: failure() && hashFiles('artifacts/p0-smoke/**') != ''
        run: |
          pwsh -NoProfile -File scripts/qa/assert-no-secrets.ps1 -ArtifactRoot artifacts/p0-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failed P0 smoke artifacts
        if: always() && steps.failed-p0-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p0-smoke-failure-${{ runner.os }}-${{ github.run_attempt }}
          path: artifacts/p0-smoke
          if-no-files-found: error

      - name: Stop isolated OpenSSH agent (Linux/macOS)
        if: always() && runner.os != 'Windows'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SSH_AGENT_PID)) { throw "The isolated ssh-agent environment is unavailable for cleanup." }
          & ssh-agent -k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop Credential Manager SSH agent (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          $cleanupErrors = [System.Collections.Generic.List[string]]::new()
          $baselineStatus = $env:RSHELL_WINDOWS_SSH_AGENT_BASELINE_STATUS
          $baselineStartupMode = $env:RSHELL_WINDOWS_SSH_AGENT_BASELINE_START_MODE
          $missingBaselineStatus = [string]::IsNullOrWhiteSpace($baselineStatus)
          $missingBaselineStartupMode = [string]::IsNullOrWhiteSpace($baselineStartupMode)
          if ($missingBaselineStatus -and $missingBaselineStartupMode) {
            Write-Output "Credential Manager SSH agent setup did not run; cleanup is not required."
            exit 0
          }
          if ($missingBaselineStatus -xor $missingBaselineStartupMode) {
            throw "Credential Manager SSH agent cleanup ledger is incomplete."
          }
          try {
            $agent = Get-Service -Name ssh-agent -ErrorAction Stop
            if ($baselineStatus -eq 'Running' -and $agent.Status -ne 'Running') {
              Start-Service -Name ssh-agent -ErrorAction Stop
            } elseif ($baselineStatus -ne 'Running' -and $agent.Status -eq 'Running') {
              Stop-Service -Name ssh-agent -ErrorAction Stop
            }
          }
          catch { $cleanupErrors.Add('status restoration failed') }
          try {
            $startupType = switch ($baselineStartupMode) {
              'Auto' { 'Automatic' }
              'Manual' { 'Manual' }
              'Disabled' { 'Disabled' }
              default { throw 'unsupported baseline startup mode' }
            }
            Set-Service -Name ssh-agent -StartupType $startupType -ErrorAction Stop
          }
          catch { $cleanupErrors.Add('startup-type restoration failed') }
          try {
            $verifiedStatus = (Get-Service -Name ssh-agent -ErrorAction Stop).Status.ToString()
            $verifiedStartupMode = (Get-CimInstance -ClassName Win32_Service -Filter "Name='ssh-agent'" -ErrorAction Stop).StartMode
            if ($verifiedStatus -ne $baselineStatus) { $cleanupErrors.Add('status verification failed') }
            if ($verifiedStartupMode -ne $baselineStartupMode) { $cleanupErrors.Add('startup-type verification failed') }
          }
          catch { $cleanupErrors.Add('cleanup verification failed') }
          if ($cleanupErrors.Count -ne 0) {
            throw "Credential Manager SSH agent cleanup failed."
          }
